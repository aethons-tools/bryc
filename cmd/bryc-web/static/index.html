<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bored Robots Yacht Club</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#f4f1ea; --panel:#fff; --ink:#26262e; --muted:#6b6b76; --line:#e2ddd2; --accent:#3a6ea5; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171c; --panel:#212128; --ink:#ececf1; --muted:#9a9aa6; --line:#33333d; --accent:#7fb0e8; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* beat display rules like label.row's grid */
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 24px 0; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 24px; max-width: 1100px; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 16px 16px 0; } }
  .stage, form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stage img { width: 100%; max-width: 512px; aspect-ratio: 1; border-radius: 8px;
    background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 24px 24px; }
  .note { color: var(--muted); font-size: 13px; text-align: center; }
  .error { color: var(--err); white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, .button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { display: grid; gap: 10px; align-content: start; }
  label.row { display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 8px; }
  .row > span { color: var(--muted); text-transform: capitalize; }
  .row.inactive { opacity: .45; }
  select, input[type=text], input[type=number] { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); width: 100%; }
  .color { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .color input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .color input[type=color]:disabled { opacity: .35; }
  .color label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  .range { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .range input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .range.random input[type=range], .range.random output { opacity: .45; }
  .range output { width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  .range label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button { border: none; border-radius: 0; padding: 6px 14px; }
  .modes button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .viewer { width: 100%; max-width: 512px; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #d0d0d4; }
  .viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .modes button:disabled { opacity: .45; cursor: not-allowed; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 512px; }
  .grid button { padding: 0; border: 2px solid transparent; border-radius: 10px; background: none; cursor: pointer; }
  .grid button:hover, .grid button:focus-visible { border-color: var(--accent); outline: none; }
  .grid img { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px;
    background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<header>
  <h1>Bored Robots Yacht Club</h1>
  <p>Pin what you like. Everything else is random.</p>
</header>
<main>
  <section class="stage">
    <div class="modes" role="group" aria-label="View">
      <button id="mode-single" type="button" aria-pressed="true">Single</button>
      <button id="mode-grid" type="button" aria-pressed="false">Grid</button>
    </div>
    <div class="modes" id="view-toggle" role="group" aria-label="Dimensions">
      <button id="view-2d" type="button" aria-pressed="true">2D</button>
      <button id="view-3d" type="button" aria-pressed="false">3D</button>
    </div>
    <div id="view-note" class="note" hidden></div>
    <img id="robot" alt="Generated robot portrait">
    <!-- 3D view (three.js): drag to rotate, scroll to zoom -->
    <div id="viewer" class="viewer" hidden></div>
    <!-- grid mode: nine robots that all follow the pinned options; click one to pick it -->
    <div id="grid" class="grid" hidden></div>
    <div id="error" class="error" hidden></div>
    <div class="actions">
      <button id="randomize" class="primary" type="button">Randomize</button>
      <a id="download" class="button" download>Download PNG</a>
      <a id="download-glb" class="button" download hidden>Download .glb</a>
    </div>
  </section>
  <form id="controls" autocomplete="off">
    <label class="row" id="seed-row"><span>Seed</span><input id="seed" type="text" inputmode="numeric" placeholder="random"></label>
    <label class="row"><span>Palette</span><select id="palette"><option value="">none</option></select></label>
    <label class="row"><span>Size</span><input id="size" type="number" step="1"></label>
    <!-- facet controls are generated from /options.json -->
  </form>
</main>
<script>
// The 3D module below resolves this once three.js has loaded, or rejects if
// WebGL or the CDN is unavailable (the page then disables the 3D button).
window.bryc3dReady = new Promise((resolve, reject) => { window.bryc3dSettle = { resolve, reject }; });
window.bryc3dReady.catch(() => {});
const form = document.getElementById('controls');
const seedInput = document.getElementById('seed');
const paletteSelect = document.getElementById('palette');
const sizeInput = document.getElementById('size');
const img = document.getElementById('robot');
const errorBox = document.getElementById('error');
const download = document.getElementById('download');
const grid = document.getElementById('grid');
const downloadGLB = document.getElementById('download-glb');
const viewer = document.getElementById('viewer');
const viewNote = document.getElementById('view-note');
const viewToggle = document.getElementById('view-toggle');
const viewButtons = { '2d': document.getElementById('view-2d'), '3d': document.getElementById('view-3d') };
const modeButtons = { single: document.getElementById('mode-single'), grid: document.getElementById('mode-grid') };
const GRID_COUNT = 9;
const GRID_SIZE = 256; // thumbnails; pick one to see it at full size
let mode = 'single';
let view = '2d'; // page-only state (URL view=3d); never sent to the server
let gridURLs = [];
// {name, read() -> string ('' = random), write(string), show(resolved value)}
const controls = [];
let defaultSize = 512;
let blobURL = null;
let glbBlobURL = null;
let ticket = 0;

function row(label, control) {
  const l = document.createElement('label');
  l.className = 'row';
  const s = document.createElement('span');
  s.textContent = label;
  l.append(s, control);
  return l;
}

function selectOf(pairs) {
  const sel = document.createElement('select');
  for (const [value, text] of pairs) sel.add(new Option(text, value));
  return sel;
}

function checkbox(text) {
  const box = document.createElement('input');
  box.type = 'checkbox';
  const label = document.createElement('label');
  label.append(box, text);
  return [box, label];
}

// Display labels for facets whose names don't read well as-is.
const labels = { eyecount: 'eye count', eyesize: 'eye size', eyestyle: 'eye style' };

// Facets that only matter for some value of another facet (e.g. eyecount
// needs round-family eyes) are greyed out while the current robot doesn't have it.
const dependents = []; // {dep: {facet, value}, row}

function track(f, rowEl) {
  if (f.dependsOn) dependents.push({ dep: f.dependsOn, row: rowEl });
  return rowEl;
}

// In grid mode there's no single robot, so dependents are judged from the
// pinned options only: an unpinned facet could be anything, so they stay active.
function updateDependents(resolved) {
  for (const { dep, row } of dependents) {
    const inactive = resolved.has(dep.facet) && !dep.values.includes(resolved.get(dep.facet));
    row.classList.toggle('inactive', inactive);
    row.title = inactive ? `Only applies when ${dep.facet} is ${dep.values.join(', ')}` : '';
    for (const el of row.querySelectorAll('select, input')) el.disabled = inactive;
  }
}

function addFacet(f) {
  if (f.kind === 'color') {
    const wrap = document.createElement('div');
    wrap.className = 'color';
    const picker = document.createElement('input');
    picker.type = 'color';
    const [rand, randLabel] = checkbox('random');
    wrap.append(picker, randLabel);
    let none = null;
    if (f.name === 'background') {
      let noneLabel;
      [none, noneLabel] = checkbox('none');
      wrap.append(noneLabel);
      none.addEventListener('change', () => { if (none.checked) rand.checked = false; sync(); });
    }
    rand.addEventListener('change', () => { if (rand.checked && none) none.checked = false; sync(); });
    function sync() { picker.disabled = rand.checked || (none && none.checked); }
    controls.push({
      name: f.name,
      read: () => rand.checked ? '' : (none && none.checked) ? 'none' : picker.value,
      write: (v) => {
        rand.checked = !v;
        if (none) none.checked = v === 'none';
        if (v && v !== 'none') picker.value = v;
        sync();
      },
      // While random, keep the picker on the robot's current color so
      // pinning starts from what you see instead of black.
      show: (v) => { if (rand.checked && /^#[0-9a-f]{6}$/.test(v)) picker.value = v; },
    });
    rand.checked = true;
    sync();
    form.append(track(f, row(labels[f.name] || f.name, wrap)));
    return;
  }
  if (f.kind === 'range') {
    const wrap = document.createElement('div');
    wrap.className = 'range';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = f.min;
    slider.max = f.max;
    slider.step = 1;
    slider.value = 0;
    const out = document.createElement('output');
    const [rand, randLabel] = checkbox('random');
    wrap.append(slider, out, randLabel);
    function sync() {
      out.value = slider.value;
      wrap.classList.toggle('random', rand.checked);
    }
    // Dragging the slider pins it; the form's change listener then re-renders.
    slider.addEventListener('input', () => { rand.checked = false; sync(); });
    rand.addEventListener('change', sync);
    controls.push({
      name: f.name,
      read: () => rand.checked ? '' : slider.value,
      write: (v) => {
        rand.checked = v === '';
        if (v !== '') slider.value = v;
        sync();
      },
      // While random, show the robot's current value so pinning starts there.
      show: (v) => { if (rand.checked && v !== '') { slider.value = v; sync(); } },
    });
    rand.checked = true;
    sync();
    form.append(track(f, row(labels[f.name] || f.name, wrap)));
    return;
  }
  const pairs = f.kind === 'bool'
    ? [['', 'random'], ['true', 'on'], ['false', 'off']]
    : [['', 'random'], ...f.values.map(v => [v, v])];
  const sel = selectOf(pairs);
  controls.push({ name: f.name, read: () => sel.value, write: (v) => { sel.value = v || ''; }, show: () => {} });
  form.append(track(f, row(labels[f.name] || f.name, sel)));
}

function currentQuery() {
  const q = new URLSearchParams();
  for (const c of controls) { const v = c.read(); if (v) q.set(c.name, v); }
  if (paletteSelect.value) q.set('palette', paletteSelect.value);
  const size = sizeInput.value.trim();
  if (size && size !== String(defaultSize)) q.set('size', size);
  const seed = seedInput.value.trim();
  if (seed) q.set('seed', seed);
  return q;
}

// randomSeed is a fresh 64-bit seed, as the decimal string the server takes.
function randomSeed() {
  return crypto.getRandomValues(new BigUint64Array(1))[0].toString();
}

function showError(text) {
  errorBox.textContent = text;
  errorBox.hidden = false;
  img.hidden = true;
  viewer.hidden = true;
  downloadGLB.hidden = true;
  grid.hidden = true;
  if (window.bryc3d) window.bryc3d.hide();
}

function applyView() {
  const three = mode === 'single' && view === '3d';
  for (const [name, button] of Object.entries(viewButtons)) button.setAttribute('aria-pressed', String(name === view));
  viewToggle.hidden = mode === 'grid';
  if (mode === 'grid') viewNote.hidden = true; else if (viewNote.textContent) viewNote.hidden = false;
  download.hidden = mode === 'grid' || three;
  img.hidden = mode === 'grid' || three;
  viewer.hidden = !three;
  downloadGLB.hidden = !three;
  if (!three && window.bryc3d) window.bryc3d.hide();
}

function setMode(m) {
  mode = m;
  if (m === 'grid') view = '2d'; // grid is 2D only
  for (const [name, button] of Object.entries(modeButtons)) button.setAttribute('aria-pressed', String(name === m));
  grid.hidden = m !== 'grid';
  applyView();
}

function setView(v) {
  view = v;
  applyView();
}

function update() {
  return mode === 'grid' ? updateGrid() : updateSingle();
}

// updateGrid renders nine robots with the current pins at thumbnail size. The
// seed field holds the grid's seed (one is picked if it's empty); the server
// derives each cell's own seed from it, so a grid seed always gives the same
// nine robots.
async function updateGrid() {
  if (!seedInput.value.trim()) seedInput.value = randomSeed();
  const q = currentQuery();
  const pins = new URLSearchParams(q);
  const mine = ++ticket;
  q.set('size', GRID_SIZE);
  const responses = await Promise.all(Array.from({ length: GRID_COUNT }, (_, cell) => {
    const cq = new URLSearchParams(q);
    cq.set('cell', cell);
    return fetch('/robot.png?' + cq);
  }));
  if (mine !== ticket) return;
  const bad = responses.find(r => !r.ok);
  if (bad) return showError(await bad.text());
  const blobs = await Promise.all(responses.map(r => r.blob()));
  if (mine !== ticket) return;
  for (const url of gridURLs) URL.revokeObjectURL(url);
  gridURLs = blobs.map(b => URL.createObjectURL(b));
  grid.replaceChildren(...responses.map((res, i) => {
    const seed = res.headers.get('X-Bryc-Seed');
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.title = `seed ${seed} — click to pick this robot`;
    const thumb = document.createElement('img');
    thumb.src = gridURLs[i];
    thumb.alt = `Robot with seed ${seed}`;
    cell.append(thumb);
    cell.addEventListener('click', () => {
      seedInput.value = seed; // the cell's own seed: the same robot, full size
      setMode('single');
      update();
    });
    return cell;
  }));
  errorBox.hidden = true;
  grid.hidden = false;
  updateDependents(pins);
  pins.set('mode', 'grid');
  history.replaceState(null, '', '?' + pins);
}

async function updateSingle() {
  const q = currentQuery();
  const mine = ++ticket;
  const three = view === '3d';
  const res = await fetch((three ? '/robot.glb?' : '/robot.png?') + q);
  if (mine !== ticket) return; // superseded by a newer change
  if (!res.ok) return showError(await res.text());
  const bytes = three ? await res.arrayBuffer() : await res.blob();
  if (mine !== ticket) return;
  const seed = res.headers.get('X-Bryc-Seed');
  seedInput.value = seed;
  q.set('seed', seed);
  const resolved = new URLSearchParams(res.headers.get('X-Bryc-Spec') || '');
  for (const c of controls) c.show(resolved.get(c.name) || '');
  updateDependents(resolved);
  if (three) q.set('view', '3d');
  history.replaceState(null, '', '?' + q);
  errorBox.hidden = true;
  if (!three) {
    if (blobURL) URL.revokeObjectURL(blobURL);
    blobURL = URL.createObjectURL(bytes);
    img.src = blobURL;
    download.href = blobURL;
    download.download = `bryc-${seed}.png`;
    applyView();
    return;
  }
  if (glbBlobURL) URL.revokeObjectURL(glbBlobURL);
  glbBlobURL = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
  downloadGLB.href = glbBlobURL;
  downloadGLB.download = `bryc-${seed}.glb`;
  applyView();
  const bg = resolved.get('background') || '';
  try {
    await window.bryc3dReady;
    if (mine !== ticket) return;
    await window.bryc3d.show(bytes, /^#[0-9a-f]{6}$/.test(bg) ? bg : null);
  } catch (e) {
    if (mine === ticket) showError(`Couldn't load the 3D model: ${e && e.message || e}`);
  }
}

document.getElementById('randomize').addEventListener('click', () => {
  seedInput.value = '';
  update();
});
modeButtons.single.addEventListener('click', () => { if (mode !== 'single') { setMode('single'); update(); } });
modeButtons.grid.addEventListener('click', () => { if (mode !== 'grid') { setMode('grid'); update(); } });
viewButtons['2d'].addEventListener('click', () => { if (view !== '2d') { setView('2d'); update(); } });
viewButtons['3d'].addEventListener('click', () => { if (view !== '3d') { setView('3d'); update(); } });
window.bryc3dReady.catch((e) => {
  viewButtons['3d'].disabled = true;
  const why = `3D view unavailable: ${e && e.message || 'WebGL or three.js could not load'}`;
  viewButtons['3d'].title = why;
  viewNote.textContent = why;
  viewNote.hidden = false;
  if (view === '3d') { setView('2d'); update(); }
});
form.addEventListener('change', update);
form.addEventListener('submit', (e) => { e.preventDefault(); update(); });

(async () => {
  const opts = await (await fetch('/options.json')).json();
  for (const p of opts.palettes) paletteSelect.add(new Option(p, p));
  defaultSize = opts.size.default;
  sizeInput.min = opts.size.min;
  sizeInput.max = opts.size.max;
  for (const f of opts.facets) addFacet(f);
  const params = new URLSearchParams(location.search);
  for (const c of controls) c.write(params.get(c.name) || '');
  paletteSelect.value = params.get('palette') || '';
  sizeInput.value = params.get('size') || defaultSize;
  seedInput.value = params.get('seed') || '';
  view = params.get('view') === '3d' ? '3d' : '2d';
  setMode(params.get('mode') === 'grid' ? 'grid' : 'single');
  update();
})();
</script>
<script type="module">
try {
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('WebGL is not available in this browser');
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const host = document.getElementById('viewer');
  let ctx = null; // {renderer, scene, camera, controls, loader}, set only once init fully succeeded
  let model = null;
  let gen = 0; // bumped by every show() and hide(); a load that is no longer current is dropped

  function init() {
    if (ctx) return ctx;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    try {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      const room = new RoomEnvironment();
      scene.environment = pmrem.fromScene(room, 0.04).texture;
      room.dispose();
      pmrem.dispose();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
      camera.position.set(0, 0, 3);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5;
      controls.addEventListener('start', () => { controls.autoRotate = false; });
      const loader = new GLTFLoader();
      const shadow = floorShadow();
      scene.add(shadow);
      host.append(renderer.domElement);
      new ResizeObserver(resize).observe(host);
      ctx = { renderer, scene, camera, controls, loader, shadow };
      return ctx;
    } catch (e) {
      renderer.dispose();
      throw e;
    }
  }

  // FLOOR_Y is the floor the head floats over, matching the 2D shadow
  // (floorShadowY in robot/geometry.go: canvas y 915 = 0.085 m).
  const FLOOR_Y = 0.085;

  // floorShadow is a soft dark oval lying on the floor, like the 2D one.
  function floorShadow() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(38,38,46,0.45)');
    grad.addColorStop(0.5, 'rgba(38,38,46,0.3)');
    grad.addColorStop(1, 'rgba(38,38,46,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }),
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = FLOOR_Y;
    return mesh;
  }

  function resize() {
    const w = host.clientWidth;
    if (!ctx || !w) return; // hidden
    ctx.renderer.setSize(w, w, false); // square; CSS sizes the canvas
    ctx.camera.aspect = 1;
    ctx.camera.updateProjectionMatrix();
  }

  function disposeModel(obj) {
    obj.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      for (const m of mats) {
        for (const v of Object.values(m)) if (v && v.isTexture) v.dispose();
        m.dispose();
      }
    });
  }

  function frame(obj) {
    const { camera, controls } = ctx;
    const box = new THREE.Box3().setFromObject(obj);
    // Size the shadow to the head (as in 2D, ~0.84 of its width and ~0.35
    // of that deep), then frame the head and its shadow together.
    const w = box.max.x - box.min.x;
    ctx.shadow.scale.set(w * 1.1, w * 0.6, 1);
    box.expandByPoint(new THREE.Vector3(0, FLOOR_Y, 0));
    const centre = box.getCenter(new THREE.Vector3());
    const radius = box.getSize(new THREE.Vector3()).length() / 2;
    const dist = (radius * 1.25) / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
    // Keep the current orbit angle: move along the camera's present direction
    // from the old target (initially +z) to the new fit distance.
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-12) dir.set(0, 0, 1);
    dir.normalize();
    controls.target.copy(centre);
    camera.position.copy(centre).addScaledVector(dir, dist);
    camera.near = dist / 100;
    camera.far = dist * 100;
    camera.updateProjectionMatrix();
    controls.update();
  }

  window.bryc3d = {
    // show displays the binary glTF in an ArrayBuffer.
    async show(buffer, background) {
      const mine = ++gen;
      const c = init();
      const gltf = await c.loader.parseAsync(buffer, '');
      if (mine !== gen) { disposeModel(gltf.scene); return; } // superseded or hidden meanwhile
      if (model) { c.scene.remove(model); disposeModel(model); }
      model = gltf.scene;
      c.scene.add(model);
      c.scene.background = new THREE.Color(background || '#d0d0d4');
      host.style.background = background || '#d0d0d4';
      resize();
      frame(model);
      c.renderer.setAnimationLoop(() => { c.controls.update(); c.renderer.render(c.scene, c.camera); });
    },
    hide() {
      gen++;
      if (ctx) ctx.renderer.setAnimationLoop(null);
    },
  };
  window.bryc3dSettle.resolve();
} catch (e) {
  window.bryc3dSettle.reject(e);
}
</script>
</body>
</html>
