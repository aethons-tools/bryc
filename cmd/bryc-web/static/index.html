<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bored Robots Yacht Club</title>
<style>
  :root { --bg:#f4f1ea; --panel:#fff; --ink:#26262e; --muted:#6b6b76; --line:#e2ddd2; --accent:#3a6ea5; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171c; --panel:#212128; --ink:#ececf1; --muted:#9a9aa6; --line:#33333d; --accent:#7fb0e8; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* beat display rules like label.row's grid */
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 24px 0; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 24px; max-width: 1100px; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 16px 16px 0; } }
  .stage, form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stage img { width: 100%; max-width: 512px; aspect-ratio: 1; border-radius: 8px;
    background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 24px 24px; }
  .error { color: var(--err); white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, .button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { display: grid; gap: 10px; align-content: start; }
  label.row { display: grid; grid-template-columns: 90px minmax(0, 1fr); align-items: center; gap: 8px; }
  .row > span { color: var(--muted); text-transform: capitalize; }
  .row.inactive { opacity: .45; }
  select, input[type=text], input[type=number] { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); width: 100%; }
  .color { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .color input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .color input[type=color]:disabled { opacity: .35; }
  .color label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  .range { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .range input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .range.random input[type=range], .range.random output { opacity: .45; }
  .range output { width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  .range label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button { border: none; border-radius: 0; padding: 6px 14px; }
  .modes button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 512px; }
  .grid button { padding: 0; border: 2px solid transparent; border-radius: 10px; background: none; cursor: pointer; }
  .grid button:hover, .grid button:focus-visible { border-color: var(--accent); outline: none; }
  .grid img { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px;
    background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<header>
  <h1>Bored Robots Yacht Club</h1>
  <p>Pin what you like. Everything else is random.</p>
</header>
<main>
  <section class="stage">
    <div class="modes" role="group" aria-label="View">
      <button id="mode-single" type="button" aria-pressed="true">Single</button>
      <button id="mode-grid" type="button" aria-pressed="false">Grid</button>
    </div>
    <img id="robot" alt="Generated robot portrait">
    <!-- grid mode: nine robots that all follow the pinned options; click one to pick it -->
    <div id="grid" class="grid" hidden></div>
    <div id="error" class="error" hidden></div>
    <div class="actions">
      <button id="randomize" class="primary" type="button">Randomize</button>
      <a id="download" class="button" download>Download PNG</a>
    </div>
  </section>
  <form id="controls" autocomplete="off">
    <label class="row" id="seed-row"><span>Seed</span><input id="seed" type="text" inputmode="numeric" placeholder="random"></label>
    <label class="row"><span>Palette</span><select id="palette"><option value="">none</option></select></label>
    <label class="row"><span>Size</span><input id="size" type="number" step="1"></label>
    <!-- facet controls are generated from /options.json -->
  </form>
</main>
<script>
const form = document.getElementById('controls');
const seedInput = document.getElementById('seed');
const paletteSelect = document.getElementById('palette');
const sizeInput = document.getElementById('size');
const img = document.getElementById('robot');
const errorBox = document.getElementById('error');
const download = document.getElementById('download');
const grid = document.getElementById('grid');
const modeButtons = { single: document.getElementById('mode-single'), grid: document.getElementById('mode-grid') };
const GRID_COUNT = 9;
const GRID_SIZE = 256; // thumbnails; pick one to see it at full size
let mode = 'single';
let gridURLs = [];
// {name, read() -> string ('' = random), write(string), show(resolved value)}
const controls = [];
let defaultSize = 512;
let blobURL = null;
let ticket = 0;

function row(label, control) {
  const l = document.createElement('label');
  l.className = 'row';
  const s = document.createElement('span');
  s.textContent = label;
  l.append(s, control);
  return l;
}

function selectOf(pairs) {
  const sel = document.createElement('select');
  for (const [value, text] of pairs) sel.add(new Option(text, value));
  return sel;
}

function checkbox(text) {
  const box = document.createElement('input');
  box.type = 'checkbox';
  const label = document.createElement('label');
  label.append(box, text);
  return [box, label];
}

// Display labels for facets whose names don't read well as-is.
const labels = { eyecount: 'eye count', eyesize: 'eye size', eyestyle: 'eye style' };

// Facets that only matter for some value of another facet (e.g. eyecount
// needs round-family eyes) are greyed out while the current robot doesn't have it.
const dependents = []; // {dep: {facet, value}, row}

function track(f, rowEl) {
  if (f.dependsOn) dependents.push({ dep: f.dependsOn, row: rowEl });
  return rowEl;
}

// In grid mode there's no single robot, so dependents are judged from the
// pinned options only: an unpinned facet could be anything, so they stay active.
function updateDependents(resolved) {
  for (const { dep, row } of dependents) {
    const inactive = resolved.has(dep.facet) && !dep.values.includes(resolved.get(dep.facet));
    row.classList.toggle('inactive', inactive);
    row.title = inactive ? `Only applies when ${dep.facet} is ${dep.values.join(', ')}` : '';
    for (const el of row.querySelectorAll('select, input')) el.disabled = inactive;
  }
}

function addFacet(f) {
  if (f.kind === 'color') {
    const wrap = document.createElement('div');
    wrap.className = 'color';
    const picker = document.createElement('input');
    picker.type = 'color';
    const [rand, randLabel] = checkbox('random');
    wrap.append(picker, randLabel);
    let none = null;
    if (f.name === 'background') {
      let noneLabel;
      [none, noneLabel] = checkbox('none');
      wrap.append(noneLabel);
      none.addEventListener('change', () => { if (none.checked) rand.checked = false; sync(); });
    }
    rand.addEventListener('change', () => { if (rand.checked && none) none.checked = false; sync(); });
    function sync() { picker.disabled = rand.checked || (none && none.checked); }
    controls.push({
      name: f.name,
      read: () => rand.checked ? '' : (none && none.checked) ? 'none' : picker.value,
      write: (v) => {
        rand.checked = !v;
        if (none) none.checked = v === 'none';
        if (v && v !== 'none') picker.value = v;
        sync();
      },
      // While random, keep the picker on the robot's current color so
      // pinning starts from what you see instead of black.
      show: (v) => { if (rand.checked && /^#[0-9a-f]{6}$/.test(v)) picker.value = v; },
    });
    rand.checked = true;
    sync();
    form.append(track(f, row(labels[f.name] || f.name, wrap)));
    return;
  }
  if (f.kind === 'range') {
    const wrap = document.createElement('div');
    wrap.className = 'range';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = f.min;
    slider.max = f.max;
    slider.step = 1;
    slider.value = 0;
    const out = document.createElement('output');
    const [rand, randLabel] = checkbox('random');
    wrap.append(slider, out, randLabel);
    function sync() {
      out.value = slider.value;
      wrap.classList.toggle('random', rand.checked);
    }
    // Dragging the slider pins it; the form's change listener then re-renders.
    slider.addEventListener('input', () => { rand.checked = false; sync(); });
    rand.addEventListener('change', sync);
    controls.push({
      name: f.name,
      read: () => rand.checked ? '' : slider.value,
      write: (v) => {
        rand.checked = v === '';
        if (v !== '') slider.value = v;
        sync();
      },
      // While random, show the robot's current value so pinning starts there.
      show: (v) => { if (rand.checked && v !== '') { slider.value = v; sync(); } },
    });
    rand.checked = true;
    sync();
    form.append(track(f, row(labels[f.name] || f.name, wrap)));
    return;
  }
  const pairs = f.kind === 'bool'
    ? [['', 'random'], ['true', 'on'], ['false', 'off']]
    : [['', 'random'], ...f.values.map(v => [v, v])];
  const sel = selectOf(pairs);
  controls.push({ name: f.name, read: () => sel.value, write: (v) => { sel.value = v || ''; }, show: () => {} });
  form.append(track(f, row(labels[f.name] || f.name, sel)));
}

function currentQuery() {
  const q = new URLSearchParams();
  for (const c of controls) { const v = c.read(); if (v) q.set(c.name, v); }
  if (paletteSelect.value) q.set('palette', paletteSelect.value);
  const size = sizeInput.value.trim();
  if (size && size !== String(defaultSize)) q.set('size', size);
  const seed = seedInput.value.trim();
  if (seed) q.set('seed', seed);
  return q;
}

// randomSeed is a fresh 64-bit seed, as the decimal string the server takes.
function randomSeed() {
  return crypto.getRandomValues(new BigUint64Array(1))[0].toString();
}

function showError(text) {
  errorBox.textContent = text;
  errorBox.hidden = false;
  img.hidden = true;
  grid.hidden = true;
}

function setMode(m) {
  mode = m;
  for (const [name, button] of Object.entries(modeButtons)) button.setAttribute('aria-pressed', String(name === m));
  download.hidden = m === 'grid';
  img.hidden = m === 'grid';
  grid.hidden = m !== 'grid';
}

function update() {
  return mode === 'grid' ? updateGrid() : updateSingle();
}

// updateGrid renders nine robots with the current pins at thumbnail size. The
// seed field holds the grid's seed (one is picked if it's empty); the server
// derives each cell's own seed from it, so a grid seed always gives the same
// nine robots.
async function updateGrid() {
  if (!seedInput.value.trim()) seedInput.value = randomSeed();
  const q = currentQuery();
  const pins = new URLSearchParams(q);
  const mine = ++ticket;
  q.set('size', GRID_SIZE);
  const responses = await Promise.all(Array.from({ length: GRID_COUNT }, (_, cell) => {
    const cq = new URLSearchParams(q);
    cq.set('cell', cell);
    return fetch('/robot.png?' + cq);
  }));
  if (mine !== ticket) return;
  const bad = responses.find(r => !r.ok);
  if (bad) return showError(await bad.text());
  const blobs = await Promise.all(responses.map(r => r.blob()));
  if (mine !== ticket) return;
  for (const url of gridURLs) URL.revokeObjectURL(url);
  gridURLs = blobs.map(b => URL.createObjectURL(b));
  grid.replaceChildren(...responses.map((res, i) => {
    const seed = res.headers.get('X-Bryc-Seed');
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.title = `seed ${seed} — click to pick this robot`;
    const thumb = document.createElement('img');
    thumb.src = gridURLs[i];
    thumb.alt = `Robot with seed ${seed}`;
    cell.append(thumb);
    cell.addEventListener('click', () => {
      seedInput.value = seed; // the cell's own seed: the same robot, full size
      setMode('single');
      update();
    });
    return cell;
  }));
  errorBox.hidden = true;
  grid.hidden = false;
  updateDependents(pins);
  pins.set('mode', 'grid');
  history.replaceState(null, '', '?' + pins);
}

async function updateSingle() {
  const q = currentQuery();
  const mine = ++ticket;
  const res = await fetch('/robot.png?' + q);
  if (mine !== ticket) return; // superseded by a newer change
  if (!res.ok) return showError(await res.text());
  const blob = await res.blob();
  if (mine !== ticket) return;
  const seed = res.headers.get('X-Bryc-Seed');
  seedInput.value = seed;
  q.set('seed', seed);
  const resolved = new URLSearchParams(res.headers.get('X-Bryc-Spec') || '');
  for (const c of controls) c.show(resolved.get(c.name) || '');
  updateDependents(resolved);
  history.replaceState(null, '', '?' + q);
  if (blobURL) URL.revokeObjectURL(blobURL);
  blobURL = URL.createObjectURL(blob);
  img.src = blobURL;
  img.hidden = false;
  errorBox.hidden = true;
  download.href = blobURL;
  download.download = `bryc-${seed}.png`;
}

document.getElementById('randomize').addEventListener('click', () => {
  seedInput.value = '';
  update();
});
modeButtons.single.addEventListener('click', () => { if (mode !== 'single') { setMode('single'); update(); } });
modeButtons.grid.addEventListener('click', () => { if (mode !== 'grid') { setMode('grid'); update(); } });
form.addEventListener('change', update);
form.addEventListener('submit', (e) => { e.preventDefault(); update(); });

(async () => {
  const opts = await (await fetch('/options.json')).json();
  for (const p of opts.palettes) paletteSelect.add(new Option(p, p));
  defaultSize = opts.size.default;
  sizeInput.min = opts.size.min;
  sizeInput.max = opts.size.max;
  for (const f of opts.facets) addFacet(f);
  const params = new URLSearchParams(location.search);
  for (const c of controls) c.write(params.get(c.name) || '');
  paletteSelect.value = params.get('palette') || '';
  sizeInput.value = params.get('size') || defaultSize;
  seedInput.value = params.get('seed') || '';
  setMode(params.get('mode') === 'grid' ? 'grid' : 'single');
  update();
})();
</script>
</body>
</html>
